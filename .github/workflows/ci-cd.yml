name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: 🧪 Test & Build (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Generate Prisma Client
        run: pnpm exec prisma generate

      - name: 🧪 Run CLI simulator tests
        run: pnpm run test:cli
        env:
          LAB_INTEGRATION: '0'

      - name: Verify browser icon exports
        run: pnpm check:icons

      - name: Verify AI contracts and offline budget
        run: |
          pnpm check:ai:contracts
          pnpm check:ai:fixtures
          pnpm check:ai:budget
          pnpm test:ai:contracts
          pnpm test:ai:browser
          pnpm exec eslint --no-ignore "src/agent/browser/**/*.{js,jsx}" src/agent/node/conversation.js src/agent/scripts/frontend-browser.cjs
          pnpm test:ai:context
          pnpm test:ai:diagnostics
          pnpm test:ai:local
          pnpm exec eslint src/shared/aiLabContract.js src/agent/contracts/aiLabContract.js src/agent/node/contract.test.js src/frontend/src/features/labs/utils/aiLabContract.test.js src/agent/scripts/generate-ai-lab-contracts.cjs src/agent/contracts/ai-lab/v1/fixtures/build-cases.cjs
          pnpm exec eslint src/agent/scripts/ai-lab-local-db.cjs src/agent/scripts/check-ai-lab-budget.cjs
          pnpm exec eslint src/agent/node/context*.js src/agent/node/redaction.js src/agent/node/evidence.js src/agent/node/outputVerifier.js
          pnpm exec eslint src/agent/node/diagnostics/*.js
          pnpm exec eslint src/agent/node/localGemini*.js src/agent/node/feedback.js src/backend/src/simulation/labFeedback.js src/agent/scripts/check-gemini-live.cjs

      - name: Setup Python for shared contract validation
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked Python service environment
        run: |
          python -m pip install uv==0.11.22
          uv sync --project src/agent/python --frozen --python python

      - name: Verify Python service and offline provider faults
        run: |
          pnpm check:ai:python
          uv run --directory src/agent/python --frozen ruff format --check app tests
          pnpm test:ai:python
          node --test src/agent/node/pythonTransport.test.js
          pnpm exec eslint src/agent/python/tests/fixtures/node-service.cjs
          pnpm exec eslint src/agent/node/pythonTransport*.js src/agent/node/python.integration.test.js src/agent/scripts/test-python-integration.cjs

      - name: Verify AI contracts in Python
        run: |
          uv run --project src/agent/python --frozen python src/agent/contracts/ai-lab/v1/check_python.py

      - name: Verify source boundaries and imports
        run: pnpm check:boundaries

      - name: 🧪 Run frontend component tests
        run: pnpm test --watchAll=false --runInBand

      - name: Run account, exam and runtime tests
        run: pnpm run test:core

      - name: 🧪 Run learning path domain tests
        run: pnpm run test:learning
        env:
          LEARNING_PATH_INTEGRATION: '0'

      - name: 🔍 Lint check
        run: >-
          pnpm exec eslint
          src/frontend/src/features/lessons/pages/Lesson.js
          src/frontend/src/features/profile/pages/Profile.js
          src/frontend/src/features/courses/pages/Roadmap.js
          src/frontend/src/features/admin/charts/RegistrationLineChart.jsx
          src/frontend/src/features/admin/components/labs/TopologyEditor.js
          src/frontend/src/features/labs/pages/Labs.js
          src/frontend/src/features/labs/components/CliLabWorkspace.js
          src/backend/src/controllers/learningController.js
          src/backend/src/controllers/labAttemptController.js
          src/backend/src/controllers/learningPathController.js
          src/backend/src/controllers/adminController.js
          src/backend/src/controllers/authController.js
          src/backend/src/controllers/userController.js
          src/backend/src/controllers/examController.js
          src/backend/src/exams/*.js
          src/backend/src/security/*.js
          src/backend/src/config/runtime.js
          src/backend/src/config/database.js
          src/backend/src/Server.js
          src/backend/src/middleware/auth.js
          src/backend/src/middleware/errorHandler.js
          src/backend/src/middleware/rateLimiter.js
          src/backend/src/middleware/validate.js
          src/backend/src/validation/examSchema.js
          src/backend/src/routes/exams.js
          src/frontend/src/features/exams/pages/*.js
          src/frontend/src/context/AuthContext.js
          src/frontend/src/services/Api.js
          src/scripts/backup-lib.cjs
          src/scripts/backup.cjs
          src/scripts/restore.cjs
          src/backend/src/domain/learningPath.js
          src/backend/src/services/learningPathService.js
          src/backend/src/validation/learningPathSchema.js
          src/backend/src/learningPath/*.test.js
          src/shared/simulation/networkPackets.js
          src/backend/src/simulation/networkApi.integration.test.js
          src/shared/sanitizeHtml.js

      - name: 🏗️ Build production bundle
        run: pnpm run build
        env:
          CI: false

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: src/frontend/build/
          retention-days: 7

  integration:
    name: 🗄️ PostgreSQL Integration
    needs: test-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netmastery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d netmastery_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Apply test schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test

      - name: Setup Python for worker integration
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install locked Python worker environment
        run: |
          python -m pip install uv==0.11.22
          uv sync --project src/agent/python --frozen --python python

      - name: Verify AI storage and Node-Python worker integration
        run: |
          node --test src/agent/node/access.test.js src/agent/node/snapshot.test.js src/agent/node/worker.test.js
          pnpm exec eslint src/agent/node/access*.js src/agent/node/snapshot*.js src/agent/node/middleware.js
          pnpm exec eslint src/agent/node/requests.js src/agent/node/quota.js src/agent/node/admission.integration.test.js src/agent/node/fixtures/admission-server.cjs src/agent/routes/aiLab.js
          pnpm exec eslint src/agent/scripts/test-ai-lab-storage.cjs src/agent/node/storage.integration.test.js
          pnpm exec eslint src/agent/node/lifecycle.js src/agent/node/serviceAuth.js src/agent/node/settlement.js src/agent/node/dispatch.js src/agent/node/receipts.js src/agent/node/leases.js src/agent/node/workerConfig.js src/agent/node/worker*.test.js src/agent/node/fixtures/worker-*.cjs src/agent/workers/aiWorker.js src/agent/routes/aiInternal.js
          pnpm test:ai:python:integration
        env:
          AI_TEST_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

      - name: 🧪 Run PostgreSQL/HTTP integration
        run: pnpm run test:cli
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          LAB_INTEGRATION: '1'

      - name: 🧪 Run learning path PostgreSQL/HTTP integration
        run: pnpm run test:learning
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          LEARNING_PATH_INTEGRATION: '1'

      - name: Run account and exam PostgreSQL/HTTP integration
        run: pnpm run test:core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          CORE_INTEGRATION: '1'

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify migration upgrade and backup restore
        run: pnpm run test:core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          OPERATIONS_INTEGRATION: '1'

  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: [test-and-build, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    concurrency:
      group: vercel-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Check Vercel deployment secrets
        id: vercel-config
        shell: bash
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if (( ${#missing[@]} > 0 )); then
            echo "Missing deployment secrets: ${missing[*]}" >&2
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel deployment secrets are configured."
          fi

      - name: Setup pnpm
        if: steps.vercel-config.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.vercel-config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔗 Pull Vercel project settings
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest pull --yes --environment=preview --git-branch=developer --token="$VERCEL_TOKEN"
          fi

      - name: 🏗️ Build Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          flags=()
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && flags+=(--prod)
          pnpm dlx vercel@latest build "${flags[@]}" --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy prebuilt Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          flags=()
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && flags+=(--prod)
          pnpm dlx vercel@latest deploy --prebuilt "${flags[@]}" --token="$VERCEL_TOKEN"
