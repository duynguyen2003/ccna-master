name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

jobs:
  test-and-build:
    name: 🧪 Test & Build (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --legacy-peer-deps

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Lint check
        run: npx eslint src/components/Content/Lesson.js src/components/Content/Profile.js src/components/Content/Roadmap.js

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          CI: false

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 7

  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to Vercel via CLI Action
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: ℹ️ Vercel Integration Notice
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "=========================================================="
          echo "✅ CI Build & Tests passed successfully!"
          echo "ℹ️  VERCEL_TOKEN is not yet configured in GitHub Secrets."
          echo "👉 Vercel GitHub App will automatically deploy this commit."
          echo "👉 To enable direct deployment via Actions, add:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID"
          echo "   - VERCEL_PROJECT_ID"
          echo "=========================================================="
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
