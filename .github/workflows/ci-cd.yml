name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

jobs:
  test-and-build:
    name: 🧪 Test & Build (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --legacy-peer-deps

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🧪 Run CLI simulator tests
        run: npm run test:cli
        env:
          LAB_INTEGRATION: '0'

      - name: 🧪 Run frontend component tests
        run: npm test -- --watchAll=false --runInBand --runTestsByPath src/components/Content/NetworkLab.test.js

      - name: 🔍 Lint check
        run: >-
          npx eslint
          src/components/Content/Lesson.js
          src/components/Content/Profile.js
          src/components/Content/Roadmap.js
          src/components/Admin/Charts/RegistrationLineChart.jsx
          src/components/Admin/Views/TopologyEditor.js
          src/components/Content/Labs.js
          src/components/Content/CliLabWorkspace.js
          src/Backend/controllers/learningController.js
          src/Backend/controllers/labAttemptController.js
          src/Backend/simulation/networkPackets.js
          src/Backend/simulation/networkApi.integration.test.js
          src/shared/sanitizeHtml.js

      - name: 🏗️ Build production bundle
        run: npm run build
        env:
          CI: false

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 7

  integration:
    name: 🗄️ PostgreSQL Integration
    needs: test-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netmastery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d netmastery_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🗄️ Apply test schema
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test

      - name: 🧪 Run PostgreSQL/HTTP integration
        run: npm run test:cli
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          LAB_INTEGRATION: '1'

  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: [test-and-build, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Check Vercel deployment secrets
        id: vercel-config
        shell: bash
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if (( ${#missing[@]} > 0 )); then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deploy skipped; missing secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel deployment secrets are configured."
          fi

      - name: 📦 Install Vercel CLI
        if: steps.vercel-config.outputs.configured == 'true'
        run: npm install --global vercel@latest

      - name: 🔗 Pull Vercel project settings
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: 🏗️ Build Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy prebuilt Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: ℹ️ Vercel Integration Notice
        if: steps.vercel-config.outputs.configured != 'true'
        run: |
          echo "=========================================================="
          echo "✅ CI Build & Tests passed successfully!"
          echo "ℹ️  Vercel deployment was skipped because required secrets are missing."
          echo "👉 Add these GitHub Actions secrets to enable CLI deployment:"
          echo "   - VERCEL_TOKEN"
          echo "   - VERCEL_ORG_ID"
          echo "   - VERCEL_PROJECT_ID"
          echo "=========================================================="
