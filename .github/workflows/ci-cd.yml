name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - developer
  pull_request:
    branches:
      - main
      - developer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: 🧪 Test & Build (Quality Gate)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Generate Prisma Client
        run: pnpm exec prisma generate

      - name: 🧪 Run CLI simulator tests
        run: pnpm run test:cli
        env:
          LAB_INTEGRATION: '0'

      - name: 🧪 Run frontend component tests
        run: pnpm test --watchAll=false --runInBand --testPathIgnorePatterns=src/Backend/

      - name: Run account, exam and runtime tests
        run: pnpm run test:core

      - name: 🧪 Run learning path domain tests
        run: pnpm run test:learning
        env:
          LEARNING_PATH_INTEGRATION: '0'

      - name: 🔍 Lint check
        run: >-
          pnpm exec eslint
          src/components/Content/Lesson.js
          src/components/Content/Profile.js
          src/components/Content/Roadmap.js
          src/components/Admin/Charts/RegistrationLineChart.jsx
          src/components/Admin/Views/TopologyEditor.js
          src/components/Content/Labs.js
          src/components/Content/CliLabWorkspace.js
          src/Backend/controllers/learningController.js
          src/Backend/controllers/labAttemptController.js
          src/Backend/controllers/learningPathController.js
          src/Backend/controllers/adminController.js
          src/Backend/controllers/authController.js
          src/Backend/controllers/userController.js
          src/Backend/controllers/examController.js
          src/Backend/exams/*.js
          src/Backend/security/*.js
          src/Backend/config/runtime.js
          src/Backend/config/database.js
          src/Backend/Server.js
          src/Backend/middleware/auth.js
          src/Backend/middleware/errorHandler.js
          src/Backend/middleware/rateLimiter.js
          src/Backend/middleware/validate.js
          src/Backend/validation/examSchema.js
          src/Backend/routes/exams.js
          src/components/Content/exam/*.js
          src/context/AuthContext.js
          src/services/Api.js
          scripts/backup-lib.cjs
          scripts/backup.cjs
          scripts/restore.cjs
          src/Backend/domain/learningPath.js
          src/Backend/services/learningPathService.js
          src/Backend/validation/learningPathSchema.js
          src/Backend/learningPath/*.test.js
          src/Backend/simulation/networkPackets.js
          src/Backend/simulation/networkApi.integration.test.js
          src/shared/sanitizeHtml.js

      - name: 🏗️ Build production bundle
        run: pnpm run build
        env:
          CI: false

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: build/
          retention-days: 7

  integration:
    name: 🗄️ PostgreSQL Integration
    needs: test-and-build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netmastery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d netmastery_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🗄️ Apply test schema
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test

      - name: 🧪 Run PostgreSQL/HTTP integration
        run: pnpm run test:cli
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          LAB_INTEGRATION: '1'

      - name: 🧪 Run learning path PostgreSQL/HTTP integration
        run: pnpm run test:learning
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          LEARNING_PATH_INTEGRATION: '1'

      - name: Run account and exam PostgreSQL/HTTP integration
        run: pnpm run test:core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          JWT_SECRET: ci-integration-secret
          CORE_INTEGRATION: '1'

      - name: Install PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Verify migration upgrade and backup restore
        run: pnpm run test:core
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/netmastery_test
          OPERATIONS_INTEGRATION: '1'

  deploy-vercel:
    name: 🚀 Deploy to Vercel
    needs: [test-and-build, integration]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/developer')
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    concurrency:
      group: vercel-${{ github.ref }}
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Check Vercel deployment secrets
        id: vercel-config
        shell: bash
        run: |
          missing=()
          [[ -z "$VERCEL_TOKEN" ]] && missing+=(VERCEL_TOKEN)
          [[ -z "$VERCEL_ORG_ID" ]] && missing+=(VERCEL_ORG_ID)
          [[ -z "$VERCEL_PROJECT_ID" ]] && missing+=(VERCEL_PROJECT_ID)

          if (( ${#missing[@]} > 0 )); then
            echo "Missing deployment secrets: ${missing[*]}" >&2
            exit 1
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "All Vercel deployment secrets are configured."
          fi

      - name: Setup pnpm
        if: steps.vercel-config.outputs.configured == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        if: steps.vercel-config.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🔗 Pull Vercel project settings
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          else
            pnpm dlx vercel@latest pull --yes --environment=preview --git-branch=developer --token="$VERCEL_TOKEN"
          fi

      - name: 🏗️ Build Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          flags=()
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && flags+=(--prod)
          pnpm dlx vercel@latest build "${flags[@]}" --token="$VERCEL_TOKEN"

      - name: 🚀 Deploy prebuilt Vercel artifacts
        if: steps.vercel-config.outputs.configured == 'true'
        run: |
          flags=()
          [[ "$GITHUB_REF" == "refs/heads/main" ]] && flags+=(--prod)
          pnpm dlx vercel@latest deploy --prebuilt "${flags[@]}" --token="$VERCEL_TOKEN"
