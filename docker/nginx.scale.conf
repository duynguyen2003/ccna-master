limit_req_zone $binary_remote_addr zone=lab_global:10m rate=4r/s;
upstream lab_backend {
    server backend:5000;
    keepalive 16;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    location /api/lab-attempts/ {
        limit_req zone=lab_global burst=24 nodelay;
        limit_req_status 429;
        proxy_pass http://lab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/ {
        proxy_pass http://lab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /uploads/ { proxy_pass http://lab_backend; }
    location / { try_files $uri $uri/ /index.html; }
}
